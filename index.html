<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#140e18" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Mara" />
  <meta name="description" content="A knock. She’s been in the apartment the whole time." />
  <title>Mara</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <link rel="icon" href="icon-180.png" type="image/png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="frame">
    <div id="stage">
      <div class="sky" aria-hidden="true"></div>
      <div class="window" aria-hidden="true">
        <div class="moon"></div>
        <div class="sun"></div>
        <div class="city">
          <span class="bld b1"></span>
          <span class="bld b2"></span>
          <span class="bld b3"></span>
          <span class="bld b4"></span>
          <span class="bld b5"></span>
        </div>
        <div class="sash"></div>
      </div>
      <div class="curtain" aria-hidden="true"></div>

      <div class="prop prop-bag" aria-hidden="true"></div>
      <div class="prop prop-hoodie" aria-hidden="true"></div>
      <div class="prop prop-towel" aria-hidden="true"></div>
      <div class="prop prop-plant" aria-hidden="true"></div>
      <div class="prop prop-book" aria-hidden="true"></div>

      <div class="lamp" aria-hidden="true">
        <div class="shade"></div>
        <div class="stem"></div>
        <div class="base"></div>
        <div class="glow"></div>
      </div>

      <!-- stylized adult, no face, no one real — pose per bucket -->
      <svg class="figure" viewBox="0 0 220 300" aria-hidden="true">
        <defs>
          <linearGradient id="skinShade" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#d4a090"/>
            <stop offset="35%" stop-color="#b07868"/>
            <stop offset="100%" stop-color="#3a2428"/>
          </linearGradient>
          <linearGradient id="clothShade" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#5a3a48"/>
            <stop offset="40%" stop-color="#2a1a24"/>
            <stop offset="100%" stop-color="#140c14"/>
          </linearGradient>
          <linearGradient id="hairShade" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#3a2820"/>
            <stop offset="50%" stop-color="#1a1010"/>
            <stop offset="100%" stop-color="#0c080c"/>
          </linearGradient>
        </defs>

        <ellipse class="fig-shadow" cx="120" cy="286" rx="52" ry="9" fill="#0c0810" opacity=".5"/>

        <!-- first / minutes: closer, here, lamp rim-light -->

          <path fill="url(#clothShade)" d="M78 168

        <g class="pose pose-days">

      </svg>

      <div class="sill" aria-hidden="true">
        <div class="cup"></div>
      </div>

      <main id="knock" class="entering">
        <p class="who">Mara</p>
        <p class="line" id="line"></p>
        <p class="beat" id="beat"></p>
        <p class="reply" id="reply" hidden></p>
        <p class="settle" id="settle" hidden></p>
        <button type="button" class="linger" id="linger" hidden></button>
        <p class="home-hint" id="home-hint" hidden></p>
      </main>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
