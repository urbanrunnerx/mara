<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#140e18" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Mara" />
  <meta name="description" content="A knock. She’s been in the apartment the whole time." />
  <title>Mara</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <link rel="icon" href="icon-180.png" type="image/png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="frame">
    <div id="stage">
      <div class="sky" aria-hidden="true"></div>
      <div class="window" aria-hidden="true">
        <div class="moon"></div>
        <div class="sun"></div>
        <div class="city">
          <span class="bld b1"></span>
          <span class="bld b2"></span>
          <span class="bld b3"></span>
          <span class="bld b4"></span>
          <span class="bld b5"></span>
        </div>
        <div class="sash"></div>
      </div>
      <div class="curtain" aria-hidden="true"></div>

      <div class="prop prop-bag" aria-hidden="true"></div>
      <div class="prop prop-hoodie" aria-hidden="true"></div>
      <div class="prop prop-towel" aria-hidden="true"></div>
      <div class="prop prop-plant" aria-hidden="true"></div>
      <div class="prop prop-book" aria-hidden="true"></div>

      <div class="lamp" aria-hidden="true">
        <div class="shade"></div>
        <div class="stem"></div>
        <div class="base"></div>
        <div class="glow"></div>
      </div>

      <!-- Adult woman, back-three-quarter. No face. Lamp rim. Knee on sill. -->
      <svg class="figure" viewBox="0 0 240 320" aria-hidden="true">
        <ellipse cx="128" cy="310" rx="56" ry="8" fill="#0a060c" opacity=".45"/>

        <g class="pose pose-here" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <!-- sill she's sitting on -->
          <rect x="48" y="246" width="180" height="12" rx="2" fill="#3a2c32" stroke="none"/>
          <!-- hips wider than waist -->
          <ellipse cx="128" cy="214" rx="40" ry="22" fill="#241820" stroke="none"/>
          <!-- torso, waist pinched -->
          <path d="M108 116 C 96 140 98 168 114 196 C 142 194 164 168 162 132 C 158 110 130 102 108 116Z"
                fill="#2c1c24" stroke="none"/>
          <path d="M132 108 C 124 150 128 180 134 206" stroke="#1a1018" stroke-width="6"/>
          <!-- near shoulder (lamp) larger -->
          <path d="M78 124 L 158 128" stroke="#d4a090" stroke-width="15"/>
          <path d="M78 124 C 62 156 58 188 78 214" stroke="#e0b0a0" stroke-width="12"/>
          <path d="M158 128 C 168 152 164 176 150 192" stroke="#6a4038" stroke-width="10"/>
          <!-- thigh to raised knee on sill -->
          <path d="M150 206 C 178 176 206 168 218 186" stroke="#d4a090" stroke-width="16"/>
          <path d="M218 186 C 226 210 220 238 204 246" stroke="#c49080" stroke-width="13"/>
          <!-- seated lower leg (short, on sill) -->
          <path d="M106 222 C 98 236 96 246 104 246" stroke="#8a6058" stroke-width="14"/>
          <path d="M128 96 L 132 110" stroke="#3a2828" stroke-width="6"/>
          <!-- long hair down the back, covers head, no face -->
          <path d="M112 48 C 94 56 90 80 102 100 C 112 112 130 112 142 102
                   C 140 84 152 70 170 68 C 186 66 196 82 190 98
                   C 186 112 176 124 168 140 C 160 158 154 176 152 188
                   C 170 120 188 90 176 60 C 164 40 132 36 112 48Z"
                fill="#120a0c" stroke="none"/>
          <path d="M78 118 C 70 128 66 144 68 160" stroke="#f6d4c4" stroke-width="5"/>
        </g>

        <g class="pose pose-hours" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <ellipse cx="128" cy="200" rx="28" ry="18" fill="#241820" stroke="none"/>
          <path d="M104 120 C 96 150 104 176 120 190 C 144 188 160 164 162 132 C 158 114 126 108 104 120Z"
                fill="#3a2430" stroke="none"/>
          <path d="M90 118 L 172 122" stroke="#3a2430" stroke-width="22"/>
          <path d="M128 108 C 124 148 126 186 130 230" stroke="#1a1018" stroke-width="8"/>
          <path d="M90 118 C 76 150 78 190 96 220" stroke="#d4a090" stroke-width="11"/>
          <path d="M172 122 C 186 160 180 210 168 250" stroke="#8a6058" stroke-width="11"/>
          <path d="M114 212 C 108 250 110 286 118 304" stroke="#8a6058" stroke-width="14"/>
          <path d="M144 210 C 150 250 148 286 140 304" stroke="#6a4840" stroke-width="14"/>
          <path d="M128 96 L 132 112" stroke="#c49080" stroke-width="8"/>
          <path d="M116 50 C 100 56 96 78 106 96 C 116 108 134 110 146 100 C 144 84 154 70 170 70 C 184 70 192 86 186 100 C 198 88 196 62 180 50 C 164 38 130 38 116 50Z"
                fill="#140c0c" stroke="none"/>
          <path d="M90 114 C 82 124 78 140 80 154" stroke="#f6d4c4" stroke-width="4"/>
        </g>

        <g class="pose pose-overnight" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <ellipse cx="150" cy="220" rx="70" ry="22" fill="#241820" stroke="none"/>
          <path d="M80 150 C 70 170 90 200 140 210 C 190 218 220 200 210 176 C 198 150 130 140 80 150Z"
                fill="#2a1c24" stroke="none"/>
          <path d="M90 148 C 120 140 170 148 200 168" stroke="#1a1018" stroke-width="8"/>
          <path d="M200 168 C 220 176 230 200 216 220" stroke="#8a6058" stroke-width="13"/>
          <path d="M70 160 C 50 170 44 196 66 210" stroke="#d4a090" stroke-width="11"/>
          <path d="M100 140 L 118 154" stroke="#c49080" stroke-width="8"/>
          <path d="M88 96 C 72 102 68 124 80 140 C 92 150 112 148 120 136 C 116 122 124 108 140 106 C 154 104 162 116 158 128 C 170 116 166 92 150 84 C 134 76 102 80 88 96Z"
                fill="#140c0c" stroke="none"/>
          <path d="M176 214 C 198 210 226 222 230 240" stroke="#2a2834" stroke-width="10"/>
          <path d="M80 148 C 72 156 68 168 70 180" stroke="#c8d0d8" stroke-width="3"/>
        </g>

        <g class="pose pose-days" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <ellipse cx="130" cy="206" rx="30" ry="18" fill="#241820" stroke="none"/>
          <path d="M106 122 C 98 152 108 178 124 194 C 148 192 164 168 164 136 C 160 116 128 110 106 122Z"
                fill="#2a1c24" stroke="none"/>
          <path d="M94 124 L 168 128" stroke="#d4a090" stroke-width="12"/>
          <path d="M94 124 C 78 150 80 186 100 214" stroke="#d4a090" stroke-width="11"/>
          <path d="M168 128 C 180 160 176 198 160 230" stroke="#8a6058" stroke-width="10"/>
          <path d="M116 214 C 110 250 112 286 120 304" stroke="#8a6058" stroke-width="14"/>
          <path d="M146 212 C 152 250 150 286 142 304" stroke="#6a4840" stroke-width="14"/>
          <path d="M130 98 L 134 114" stroke="#c49080" stroke-width="8"/>
          <path d="M120 52 C 104 58 100 80 110 98 C 120 110 138 112 150 102 C 148 86 158 72 174 72 C 188 72 196 88 190 102 C 202 90 200 64 184 52 C 168 40 134 40 120 52Z"
                fill="#140c0c" stroke="none"/>
          <path d="M94 120 C 86 130 82 146 84 160" stroke="#f6d4c4" stroke-width="4"/>
        </g>
      </svg>

      <div class="sill" aria-hidden="true">
        <div class="cup"></div>
      </div>

      <main id="knock" class="entering">
        <p class="who">Mara</p>
        <p class="line" id="line"></p>
        <p class="beat" id="beat"></p>
        <p class="reply" id="reply" hidden></p>
        <p class="settle" id="settle" hidden></p>
        <button type="button" class="linger" id="linger" hidden></button>
        <p class="home-hint" id="home-hint" hidden></p>
      </main>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
